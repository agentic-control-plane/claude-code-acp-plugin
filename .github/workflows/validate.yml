# CI for the gap that hid a four-month total install failure (#593):
# `claude plugin validate` checks marketplace.json, NOT plugin.json, so an
# invalid plugin manifest false-greens locally while `claude plugin install`
# fails for every user. A real install into a scratch HOME is the only
# honest check — so CI performs one on every change.
name: validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  manifest:
    name: manifest schema + real install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Syntax-check hook scripts
        run: |
          for f in bin/*.mjs lib/*.mjs; do node --check "$f"; done

      - name: Manifest schema checks (what `claude plugin validate` skips)
        run: node scripts/validate-manifest.mjs

      - name: Real install into a scratch HOME
        run: |
          npm install -g @anthropic-ai/claude-code
          export HOME="$RUNNER_TEMP/scratch-home"
          mkdir -p "$HOME"
          claude plugin marketplace add "$GITHUB_WORKSPACE"
          claude plugin install agentic-control-plane@acp
          claude plugin list | tee "$RUNNER_TEMP/plugins.txt"
          grep -q "agentic-control-plane" "$RUNNER_TEMP/plugins.txt"
          grep -q "enabled" "$RUNNER_TEMP/plugins.txt"

  version-bump:
    # A changed hook under a version the gateway has already pinned is
    # reported as tampered on every install (one hash per version).
    name: hook change needs a version bump
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: node scripts/check-version-bump.mjs "origin/${{ github.base_ref }}"

  tests:
    name: unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Bare `node --test` auto-discovers ./test — `node --test test/` breaks
      # on Linux node 22 (the trailing-slash arg is resolved as a module).
      - run: node --test
